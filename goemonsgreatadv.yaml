name: Goemons Great Adv (North America)
# The DECOMPRESSED working ROM (canon-decompilation-tools/nisitenma_archive.py unpack); the final ROM's sha1 is in
# goemonsgreatadv.us.sha1 and canon-decompilation-tools/build_rom.py checks both.
sha1: a0db6785e180f41b47f340d12e13ceabcbcc292d
options:
  basename: goemonsgreatadv
  target_path: baserom.us.decompressed.z64
  elf_path: build/goemonsgreatadv.elf
  base_path: .
  platform: n64
  compiler: IDO
  # Overlays 8, 9 and 10 share VRAM 0x801738A0: names carry the segment so they cannot collide
  symbol_name_format: $VRAM_$SEG

  # asm_path: asm
  # src_path: src
  # The original's hand-written assembly (the entry point, rspboot) is source: src/<name>.s
  hasm_in_src_path: True
  # Every function's asm is written to asm/nonmatchings/, matched or not: match_function.py
  # check takes the game's code from there, and report_progress.py counts from it
  disassemble_all: True
  # build_path: build
  # create_asm_dependencies: True

  ld_script_path: goemonsgreatadv.ld
  # libultra's objects, built from lib/ultralib's source by canon-decompilation-tools/build_libultra.py
  lib_path: build/lib
  ld_dependencies: True

  find_file_boundaries: True
  header_encoding: ASCII

  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  # section_order: [".text", ".data", ".rodata", ".bss"]
  # auto_link_sections: [".data", ".rodata", ".bss"]

  symbol_addrs_path:
    - symbol_addrs.txt
  reloc_addrs_path:
    - reloc_addrs.txt

  # undefined_funcs_auto_path: undefined_funcs_auto.txt
  # undefined_syms_auto_path: undefined_syms_auto.txt

  extensions_path: tools/splat_ext

  # string_encoding: ASCII
  # data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  # libultra_symbols: True
  # hardware_regs: True
  # gfx_ucode: # one of [f3d, f3db, f3dex, f3dexb, f3dex2]
segments:
  - name: header
    type: header
    start: 0x0

  - name: ipl3
    type: bin
    start: 0x40

  - name: entry
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, hasm, entry]

  - name: main
    type: code
    start: 0x1060
    vram: 0x80000460
    follows_vram: entry
    bss_size: 0x88600
    # Source-file boundaries: splat's suggestions (functions padded with nops to 16 bytes)
    subsegments:
      - [0x1060, c, main]
      - [0x2480, c, dma]
      - [0x29C0, c, contpak]
      - [0x3AE0, c, romdecode]
      - [0x43A0, c, file]
      - [0x5480, c, sys]
      - [0x6000, c, heap]
      - [0x6420, c, pic]
      - [0x7DB0, c, fileres]
      - [0x8900, c, audio]
      - [0xC1D0, c, sndtrack]
      - [0xDA50, c, sndcmd]
      # From here to the data, libultra 2.0I and the SDK's audio library. A lib entry is that
      # ultralib object, compiled from lib/ultralib's source (canon-decompilation-tools/build_libultra.py); asm is what
      # is not matched yet.
      - [0xFB20, lib, libultra_rom, os_sendmesg]
      - [0xFC70, lib, libultra_rom, J_io_pfsfreeblocks]
      - [0xFE10, lib, libultra_rom, os_recvmesg]
